AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Backend for AWS Cloud Resume Challenge

Globals:
  Function:
    Timeout: 10
    MemorySize: 256

Resources:
  VisitorTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: PortfolioVisitors
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH

  ResumeApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins:
          - "https://anfernee.dev"
          - "https://www.anfernee.dev"
          - "http://localhost:3000"
        AllowMethods:
          - GET
          - OPTIONS
        AllowHeaders:
          - "*"
        MaxAge: 600

  VisitorFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: api/
      Handler: app.lambda_handler
      Runtime: python3.11
      Architectures:
        - arm64
      Environment:
        Variables:
          TABLE_NAME: !Ref VisitorTable
          GITHUB_TOKEN_SECRET_ID: portfolio/github-calendar-token
          GITHUB_USERNAME: AnferneeDev
      Events:
        ApiEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref ResumeApi
            Path: /visitors
            Method: GET
        CalendarEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref ResumeApi
            Path: /github-calendar
            Method: GET
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref VisitorTable
        - Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource: !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:portfolio/github-calendar-token*"

Outputs:
  ApiEndpoint:
    Description: "API Gateway endpoint URL"
    Value: !Sub "https://${ResumeApi}.execute-api.${AWS::Region}.amazonaws.com/visitors"
  GithubCalendarEndpoint:
    Description: "GitHub calendar proxy endpoint URL"
    Value: !Sub "https://${ResumeApi}.execute-api.${AWS::Region}.amazonaws.com/github-calendar"
