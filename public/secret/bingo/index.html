<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bingo Builder (Final Fit)</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css" rel="stylesheet" />

    <style>
      body {
        font-family: "Segoe UI", sans-serif;
        background-color: #ffffff;
        color: #333;
        margin: 0;
        padding: 20px;
        display: flex;
        flex-direction: column;
        align-items: center;
        height: 100vh;
        overflow: hidden;
      }

      /* Controls */
      .controls {
        background: #f8f9fa;
        padding: 15px;
        border-radius: 8px;
        margin-bottom: 15px;
        display: flex;
        gap: 15px;
        flex-wrap: wrap;
        align-items: flex-end;
        width: 95%;
        border: 1px solid #ddd;
        flex-shrink: 0;
        z-index: 100;
      }

      .control-group {
        display: flex;
        flex-direction: column;
      }
      label {
        margin-bottom: 5px;
        font-size: 0.85rem;
        font-weight: 600;
      }
      input[type="range"] {
        cursor: pointer;
        width: 100px;
      }
      input[type="number"] {
        padding: 5px;
        border: 1px solid #ccc;
        width: 80px;
      }

      button {
        background-color: #007bff;
        color: white;
        border: none;
        padding: 8px 16px;
        border-radius: 4px;
        cursor: pointer;
      }
      button.download-btn {
        background-color: #6610f2;
        margin-left: auto;
      }

      /* PREVIEW AREA */
      .preview-area {
        flex-grow: 1;
        width: 100%;
        background: #ccc;
        background-image: radial-gradient(#999 1px, transparent 1px);
        background-size: 20px 20px;
        position: relative;
        border: 1px solid #999;
        /* We use flex to center the preview-wrapper, 
           but the wrapper itself will handle the scaling */
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }

      /* The Wrapper helps us center the scaled content perfectly */
      #preview-wrapper {
        width: 0;
        height: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      /* The Collage Canvas */
      #collage-container {
        background-color: black;
        /* Fixed size set by JS */
        flex-shrink: 0;

        display: grid;
        /* Columns/Rows handled by JS */
        gap: 10px;
        padding: 10px;
        box-sizing: border-box;
        box-shadow: 0 0 50px rgba(0, 0, 0, 0.5);
      }

      /* Image Wrapper */
      .card-wrapper {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }

      .bingo-card {
        width: 100%;
        height: 100%;
        /* FILL = Stretch to fit box. 
           COVER = Crop to fit box. 
           CONTAIN = Black bars. 
           Based on your request, FILL is the only option. */
        object-fit: fill;
        display: block;
        cursor: pointer;
        border: 1px solid #333;
        box-sizing: border-box;
      }
      .bingo-card:hover {
        outline: 4px solid #007bff;
        z-index: 10;
      }

      /* The X Button */
      .delete-btn {
        position: absolute;
        top: 5px;
        right: 5px;
        background-color: red;
        color: white;
        border: 2px solid white;
        border-radius: 50%;
        width: 25px;
        height: 25px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: bold;
        cursor: pointer;
        z-index: 20;
      }

      /* Modal */
      #crop-modal {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(255, 255, 255, 0.95);
        z-index: 1000;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }
      .crop-container {
        max-width: 80%;
        max-height: 70vh;
        background: #333;
      }
      .crop-container img {
        max-width: 100%;
        max-height: 70vh;
        display: block;
      }
      .modal-buttons {
        margin-top: 20px;
        display: flex;
        gap: 15px;
      }
      .modal-buttons button.cancel {
        background-color: #dc3545;
      }
      .modal-buttons button.save {
        background-color: #28a745;
      }
    </style>
  </head>
  <body>
    <div class="controls">
      <div class="control-group">
        <label>1. Upload Boards</label>
        <input type="file" id="imageInput" multiple accept="image/*" />
      </div>
      <div class="control-group">
        <label>Boards/Row: <span id="colVal">3</span></label>
        <input type="range" id="colInput" min="1" max="5" value="3" />
      </div>
      <div class="control-group">
        <label>Spacing: <span id="gapVal">20</span></label>
        <input type="range" id="gapInput" min="0" max="50" value="20" />
      </div>
      <div class="control-group">
        <label>Width (px)</label>
        <input type="number" id="widthInput" value="1600" />
      </div>
      <div class="control-group">
        <label>Height (px)</label>
        <input type="number" id="heightInput" value="1300" />
      </div>
      <button class="download-btn" onclick="downloadImage()">Download Image</button>
    </div>

    <div class="preview-area" id="previewArea">
      <div id="preview-wrapper">
        <div id="collage-container"></div>
      </div>
    </div>

    <div id="crop-modal">
      <h2 style="color: #333">Crop Board</h2>
      <div class="crop-container"><img id="image-to-crop" src="" /></div>
      <div class="modal-buttons">
        <button class="cancel" onclick="closeModal()">Cancel</button>
        <button class="save" onclick="saveCrop()">Save Crop</button>
      </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>

    <script>
      const imageInput = document.getElementById("imageInput");
      const collageContainer = document.getElementById("collage-container");
      const wrapper = document.getElementById("preview-wrapper");
      const previewArea = document.getElementById("previewArea");
      const widthInput = document.getElementById("widthInput");
      const heightInput = document.getElementById("heightInput");
      const colInput = document.getElementById("colInput");

      let currentCropper = null;
      let currentEditingImg = null;

      // --- 1. Canvas Sizing & Scaling (THE FIX) ---
      function updateCanvas() {
        const actualWidth = parseInt(widthInput.value) || 1280;
        const actualHeight = parseInt(heightInput.value) || 720;

        // 1. Set the physical pixel size of the container
        collageContainer.style.width = actualWidth + "px";
        collageContainer.style.height = actualHeight + "px";

        // 2. Calculate Scale to fit the Preview Area
        const margin = 40;
        const availableWidth = previewArea.clientWidth - margin;
        const availableHeight = previewArea.clientHeight - margin;

        const scaleX = availableWidth / actualWidth;
        const scaleY = availableHeight / actualHeight;

        // Always fit entirely on screen
        const scale = Math.min(scaleX, scaleY);

        // Apply Scale to the wrapper
        // We use wrapper scaling to avoid top/left absolute positioning math headaches
        collageContainer.style.transform = `scale(${scale})`;
      }

      // Resize listeners
      new ResizeObserver(updateCanvas).observe(previewArea);
      widthInput.addEventListener("input", updateCanvas);
      heightInput.addEventListener("input", updateCanvas);
      // Run immediately
      updateCanvas();

      // --- 2. Dynamic Grid Logic (Fills the Height) ---
      function updateGridRows() {
        const count = collageContainer.children.length;
        const cols = parseInt(colInput.value);

        // Calculate needed rows
        let rows = Math.ceil(count / cols);
        if (rows < 1) rows = 1;

        collageContainer.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
        // This forces the rows to split the Container Height evenly
        collageContainer.style.gridTemplateRows = `repeat(${rows}, 1fr)`;
      }

      colInput.addEventListener("input", (e) => {
        document.getElementById("colVal").innerText = e.target.value;
        updateGridRows();
      });

      document.getElementById("gapInput").addEventListener("input", (e) => {
        document.getElementById("gapVal").innerText = e.target.value;
        collageContainer.style.gap = `${e.target.value}px`;
      });

      // --- 3. Adding Images ---
      imageInput.addEventListener("change", (e) => {
        const files = e.target.files;
        if (!files.length) return;
        Array.from(files).forEach((file) => {
          const reader = new FileReader();
          reader.onload = (event) => {
            const wrap = document.createElement("div");
            wrap.classList.add("card-wrapper");

            const img = document.createElement("img");
            img.src = event.target.result;
            img.classList.add("bingo-card");
            img.addEventListener("click", () => openCropModal(img));

            const delBtn = document.createElement("button");
            delBtn.innerText = "X";
            delBtn.classList.add("delete-btn");
            delBtn.addEventListener("click", (ev) => {
              ev.stopPropagation();
              collageContainer.removeChild(wrap);
              updateGridRows();
            });

            wrap.appendChild(img);
            wrap.appendChild(delBtn);
            collageContainer.appendChild(wrap);

            updateGridRows();
          };
          reader.readAsDataURL(file);
        });
        imageInput.value = "";
      });

      // --- 4. Cropping ---
      function openCropModal(img) {
        currentEditingImg = img;
        document.getElementById("image-to-crop").src = img.src;
        document.getElementById("crop-modal").style.display = "flex";
        if (currentCropper) currentCropper.destroy();

        currentCropper = new Cropper(document.getElementById("image-to-crop"), {
          viewMode: 1,
          autoCrop: false,
          dragMode: "crop",
          background: false,
        });
      }

      function saveCrop() {
        if (!currentCropper) return;
        const canvas = currentCropper.getCroppedCanvas();
        if (canvas) {
          currentEditingImg.src = canvas.toDataURL();
        }
        closeModal();
      }
      function closeModal() {
        document.getElementById("crop-modal").style.display = "none";
        if (currentCropper) currentCropper.destroy();
      }

      // --- 5. Download ---
      function downloadImage() {
        const btns = document.querySelectorAll(".delete-btn");
        btns.forEach((b) => (b.style.display = "none"));

        // Capture logic
        const originalTransform = collageContainer.style.transform;

        // Remove scale so we capture full resolution
        collageContainer.style.transform = "scale(1)";

        html2canvas(collageContainer, {
          scale: 1,
          backgroundColor: "#000000",
          useCORS: true,
        }).then((canvas) => {
          const link = document.createElement("a");
          link.download = "bingo-collage.png";
          link.href = canvas.toDataURL("image/png");
          link.click();

          // Restore scale
          collageContainer.style.transform = originalTransform;
          btns.forEach((b) => (b.style.display = "flex"));
        });
      }
    </script>
  </body>
</html>
