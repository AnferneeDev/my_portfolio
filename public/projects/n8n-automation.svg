<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#EA580C"/>
      <stop offset="100%" stop-color="#F97316"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg)"/>
  
  <!-- Grid pattern -->
  <g opacity="0.06">
    <line x1="0" y1="0" x2="800" y2="0" stroke="#fff" stroke-width="0.5"/>
    <line x1="0" y1="50" x2="800" y2="50" stroke="#fff" stroke-width="0.5"/>
    <line x1="0" y1="100" x2="800" y2="100" stroke="#fff" stroke-width="0.5"/>
    <line x1="0" y1="150" x2="800" y2="150" stroke="#fff" stroke-width="0.5"/>
    <line x1="0" y1="200" x2="800" y2="200" stroke="#fff" stroke-width="0.5"/>
    <line x1="0" y1="250" x2="800" y2="250" stroke="#fff" stroke-width="0.5"/>
    <line x1="0" y1="300" x2="800" y2="300" stroke="#fff" stroke-width="0.5"/>
    <line x1="0" y1="350" x2="800" y2="350" stroke="#fff" stroke-width="0.5"/>
    <line x1="0" y1="400" x2="800" y2="400" stroke="#fff" stroke-width="0.5"/>
    <line x1="200" y1="0" x2="200" y2="450" stroke="#fff" stroke-width="0.5"/>
    <line x1="400" y1="0" x2="400" y2="450" stroke="#fff" stroke-width="0.5"/>
    <line x1="600" y1="0" x2="600" y2="450" stroke="#fff" stroke-width="0.5"/>
  </g>

  <!-- Connection lines -->
  <g stroke="#475569" stroke-width="2" opacity="0.5">
    <path d="M110 155 C110 200, 360 200, 360 155" />
    <path d="M110 155 C110 300, 640 300, 640 155" />
    <path d="M360 155 C360 200, 640 200, 640 155" />
  </g>

  <!-- Node: Webhook -->
  <g>
    <rect x="40" y="110" width="140" height="90" rx="12" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
    <circle cx="70" cy="140" r="16" fill="url(#orangeGrad)" opacity="0.2"/>
    <circle cx="70" cy="140" r="8" fill="url(#orangeGrad)" filter="url(#glow)"/>
    <text x="95" y="137" fill="#F97316" font-family="monospace" font-size="12" font-weight="600">Webhook</text>
    <text x="95" y="157" fill="#94A3B8" font-family="monospace" font-size="10">Incoming HTTP</text>
    <text x="95" y="177" fill="#64748B" font-family="monospace" font-size="9">POST /trigger</text>
    <circle cx="110" cy="200" r="4" fill="#334155"/>
  </g>

  <!-- Node: Code (JS) -->
  <g>
    <rect x="290" y="110" width="140" height="90" rx="12" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
    <circle cx="320" cy="140" r="16" fill="url(#blueGrad)" opacity="0.2"/>
    <circle cx="320" cy="140" r="8" fill="url(#blueGrad)" filter="url(#glow)"/>
    <text x="345" y="137" fill="#60A5FA" font-family="monospace" font-size="12" font-weight="600">Code</text>
    <text x="345" y="157" fill="#94A3B8" font-family="monospace" font-size="10">Transform data</text>
    <text x="345" y="177" fill="#64748B" font-family="monospace" font-size="9">JavaScript</text>
    <circle cx="360" cy="110" r="4" fill="#334155"/>
    <circle cx="360" cy="200" r="4" fill="#334155"/>
  </g>

  <!-- Node: Database -->
  <g>
    <rect x="570" y="110" width="140" height="90" rx="12" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
    <circle cx="600" cy="140" r="16" fill="url(#greenGrad)" opacity="0.2"/>
    <circle cx="600" cy="140" r="8" fill="url(#greenGrad)" filter="url(#glow)"/>
    <text x="625" y="137" fill="#34D399" font-family="monospace" font-size="12" font-weight="600">Database</text>
    <text x="625" y="157" fill="#94A3B8" font-family="monospace" font-size="10">Store results</text>
    <text x="625" y="177" fill="#64748B" font-family="monospace" font-size="9">PostgreSQL</text>
    <circle cx="640" cy="110" r="4" fill="#334155"/>
  </g>

  <!-- Bottom row: Email + Slack -->
  <g>
    <rect x="570" y="250" width="140" height="90" rx="12" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
    <circle cx="600" cy="280" r="16" fill="url(#purpleGrad)" opacity="0.2"/>
    <circle cx="600" cy="280" r="8" fill="url(#purpleGrad)" filter="url(#glow)"/>
    <text x="625" y="277" fill="#A78BFA" font-family="monospace" font-size="12" font-weight="600">Notify</text>
    <text x="625" y="297" fill="#94A3B8" font-family="monospace" font-size="10">Send report</text>
    <text x="625" y="317" fill="#64748B" font-family="monospace" font-size="9">Email + Slack</text>
    <circle cx="660" cy="295" r="4" fill="#334155"/>
  </g>

  <!-- Connecting line to Notify -->
  <path d="M640 200 C640 240, 660 240, 660 250" stroke="#475569" stroke-width="2" opacity="0.5"/>

  <!-- n8n logo area -->
  <g opacity="0.7">
    <text x="40" y="380" fill="#64748B" font-family="monospace" font-size="11">n8n Workflow Automation</text>
    <text x="40" y="398" fill="#475569" font-family="monospace" font-size="9">Self-hosted • AWS EC2 • Cloudflare Tunnel</text>
    <rect x="40" y="408" width="720" height="1" fill="#1E293B"/>
  </g>

  <!-- Status indicator -->
  <g>
    <circle cx="740" cy="388" r="5" fill="#22C55E" opacity="0.8"/>
    <text x="752" y="392" fill="#4ADE80" font-family="monospace" font-size="10">ACTIVE</text>
  </g>
</svg>