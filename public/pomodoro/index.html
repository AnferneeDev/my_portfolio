<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Pomodoro Prototype</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #f4f4f9; }
        .timer-container { text-align: center; background: white; padding: 2rem; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .time-display { font-size: 4rem; font-weight: bold; margin-bottom: 1.5rem; transition: color 0.3s ease; }
        button { padding: 0.75rem 1.5rem; margin: 0 0.5rem; border: none; border-radius: 6px; cursor: pointer; background-color: #007bff; color: white; font-size: 1rem; transition: background-color 0.2s; }
        button:hover { background-color: #0056b3; }
        .danger { background-color: #dc3545; }
        .danger:hover { background-color: #a71d2a; }
    </style>
</head>
<body>
    <div class="timer-container">
        <div class="time-display" id="time">25:00</div>
        <div>
            <button id="startBtn">Start</button>
            <button id="pauseBtn">Pause</button>
            <button id="resetBtn" class="danger">Reset</button>
        </div>
    </div>
    <script src="/pomodoro/app.js"></script>
</body>
</html>
